<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LBVFL</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #0057b7 50%, #ffd700 50%);
            font-family: Arial, sans-serif;
            overflow: hidden;
            position: relative; /* Дозволяє абсолютно позиціонувати елементи */
        }
        h1 {
            font-size: 200px;
            color: #000000;
            text-align: center;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
            letter-spacing: 3px;
            margin: 0;
            /* Магія абсолютного центрування для тексту */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
        }
        /* Кнопка прив'язана до низу і не заважає тексту */
        .btn-container {
            position: absolute;
            bottom: 15%; /* Відступ кнопки від нижнього краю екрана */
            left: 50%;
            transform: translateX(-50%);
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            background-color: #24292e;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: background-color 0.2s, transform 0.2s;
        }
        .btn:hover {
            background-color: #2f363d;
            transform: translateY(-2px);
        }
        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- Напис тепер строго по центру -->
    <h1>LBVFL</h1>

    <!-- Кнопка розміщена внизу екрана -->
    <div class="btn-container">
        <a class="btn" href="https://github.com/lbvfl/lampa-plugins" target="_blank">GitHub →</a>
    </div>

</body>
</html>
